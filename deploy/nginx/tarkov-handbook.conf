# /etc/nginx/sites-available/tarkov-handbook.example.com.conf
# Then: ln -s ../sites-available/... /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Get the cert with: certbot --nginx -d tarkov-handbook.example.com
# (certbot rewrites this file to add the listen 443 / ssl_* lines and an
#  http -> https redirect).

server {
    listen 80;
    listen [::]:80;
    server_name tarkov-handbook.example.com;

    # Keep request bodies small; the panel only takes tiny JSON.
    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:4786;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (/api/logs/stream): no buffering, long-lived.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
